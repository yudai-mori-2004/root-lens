apply plugin: "com.android.application"

android {
    namespace "io.rootlens.mentra"
    compileSdk 35

    defaultConfig {
        applicationId "io.rootlens.mentra"
        minSdk 30
        targetSdk 30
        versionCode 32
        versionName "0.1.30"
        testInstrumentationRunner "io.rootlens.mentra.CaptureStorageInstrumentation"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // This APK is side-loaded onto the fixed Android 11 Mentra appliance, not distributed via Play.
        disable "ExpiredTargetSdkVersion"
    }
}
